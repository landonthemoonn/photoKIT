<svg width="400" height="280" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Camera Icon -->
  <g transform="translate(40, 20)">
    <!-- Camera body outline with rounded corners -->
    <rect x="50" y="60" width="220" height="100" rx="20" fill="none" stroke="black" stroke-width="20"/>

    <!-- Camera strap hole -->
    <circle cx="60" cy="40" r="15" fill="none" stroke="black" stroke-width="20"/>
    <line x1="60" y1="40" x2="60" y2="60" stroke="black" stroke-width="20"/>

    <!-- Camera lens (large circle on left) -->
    <circle cx="130" cy="110" r="35" fill="none" stroke="black" stroke-width="16"/>

    <!-- Plus button (top right) -->
    <g transform="translate(210, 75)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="black" stroke-width="14" stroke-linecap="round"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="black" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Minus/horizontal button (middle right) -->
    <line x1="232" y1="110" x2="256" y2="110" stroke="black" stroke-width="14" stroke-linecap="round"/>

    <!-- Shutter button (bottom right with rounded shape) -->
    <rect x="210" y="125" width="50" height="20" rx="10" fill="none" stroke="black" stroke-width="14"/>
  </g>

  <!-- Orange dot accent -->
  <circle cx="360" cy="100" r="12" fill="#FF8833"/>

  <!-- Text: PHOTO (black) -->
  <text x="50" y="240" font-family="Arial, sans-serif" font-size="85" font-weight="900" fill="#050505">PHOTO</text>

  <!-- Text: KIT (orange) -->
  <text x="50" y="275" font-family="Arial, sans-serif" font-size="85" font-weight="900" fill="#FF8833">KIT</text>
</svg>
