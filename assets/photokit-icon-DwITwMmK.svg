<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified camera icon for favicon/small use -->
  <rect x="10" y="30" width="70" height="50" rx="8" fill="none" stroke="black" stroke-width="6"/>
  <circle cx="15" cy="18" r="6" fill="none" stroke="black" stroke-width="6"/>
  <line x1="15" y1="18" x2="15" y2="30" stroke="black" stroke-width="6"/>
  <circle cx="38" cy="55" r="14" fill="none" stroke="black" stroke-width="5"/>
  <circle cx="90" cy="40" r="8" fill="#FF8833"/>
  <!-- Plus button -->
  <line x1="65" y1="38" x2="65" y2="50" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <line x1="59" y1="44" x2="71" y2="44" stroke="black" stroke-width="5" stroke-linecap="round"/>
  <!-- Shutter -->
  <rect x="60" y="58" width="16" height="8" rx="4" fill="none" stroke="black" stroke-width="4"/>
</svg>
